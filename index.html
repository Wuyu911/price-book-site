<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, viewport-fit=cover" />
    <meta name="theme-color" content="#8f1d2c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="门店价目册" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>门店价目册</title>
    <style>
      :root {
        color-scheme: light;
        --app-bar: #8f1d2c;
        --app-bar-deep: #701722;
        --nav: #17212b;
        --nav-muted: #9da8b3;
        --canvas: #e8edf1;
        --surface: #ffffff;
        --surface-soft: #f6f7f8;
        --line: #dfe4e8;
        --text: #1b2026;
        --muted: #69727d;
        --gold: #9b713c;
        --active-soft: #f9e9e8;
        --danger: #b4232b;
        --topbar-height: 58px;
        --rail-width: 92px;
        --panel-width: 278px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        background: var(--canvas);
        color: var(--text);
        letter-spacing: 0;
        -webkit-tap-highlight-color: transparent;
      }

      button,
      input {
        font: inherit;
        letter-spacing: 0;
      }

      button {
        cursor: pointer;
      }

      .hidden {
        display: none !important;
      }

      .access-screen {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          linear-gradient(rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.94)),
          url("./pages/page-001.jpg") center / cover;
      }

      .access-card {
        width: min(100%, 420px);
        padding: 28px;
        border: 1px solid rgba(143, 29, 44, 0.14);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.98);
        box-shadow: 0 18px 48px rgba(34, 24, 20, 0.16);
      }

      .access-brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 24px;
      }

      .brand-mark {
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        border-radius: 8px;
        background: var(--app-bar);
        color: #fff;
        font-size: 22px;
        font-weight: 700;
      }

      .access-brand strong {
        display: block;
        font-size: 18px;
      }

      .access-brand span {
        display: block;
        margin-top: 3px;
        color: var(--muted);
        font-size: 13px;
      }

      .access-title {
        margin: 0 0 8px;
        font-size: 24px;
        font-weight: 700;
      }

      .access-text {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.7;
      }

      .access-form {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        margin-top: 22px;
      }

      .password-input {
        min-width: 0;
        min-height: 48px;
        padding: 0 14px;
        border: 1px solid #c9d0d6;
        border-radius: 6px;
        outline: none;
        background: #fff;
        color: var(--text);
        font-size: 16px;
      }

      .password-input:focus {
        border-color: var(--app-bar);
        box-shadow: 0 0 0 3px rgba(143, 29, 44, 0.12);
      }

      .primary-button {
        min-height: 48px;
        padding: 0 20px;
        border: 0;
        border-radius: 6px;
        background: var(--app-bar);
        color: #fff;
        font-weight: 700;
      }

      .primary-button:active {
        background: var(--app-bar-deep);
      }

      .access-error {
        min-height: 21px;
        margin-top: 10px;
        color: #b4232b;
        font-size: 13px;
      }

      .app-shell {
        width: 100%;
        height: 100dvh;
        display: grid;
        grid-template-rows: var(--topbar-height) minmax(0, 1fr);
        overflow: hidden;
      }

      .topbar {
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: env(safe-area-inset-top) 14px 0;
        background: var(--app-bar);
        color: #fff;
        box-shadow: 0 2px 8px rgba(60, 18, 24, 0.24);
        z-index: 50;
      }

      .topbar-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 228px;
      }

      .topbar-brand .brand-mark {
        width: 36px;
        height: 36px;
        border: 1px solid rgba(255, 255, 255, 0.42);
        background: rgba(255, 255, 255, 0.12);
        font-size: 18px;
      }

      .topbar-title {
        min-width: 0;
      }

      .topbar-title strong,
      .topbar-title span {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .topbar-title strong {
        font-size: 16px;
      }

      .topbar-title span {
        margin-top: 2px;
        color: rgba(255, 255, 255, 0.72);
        font-size: 11px;
      }

      .breadcrumb {
        min-width: 0;
        flex: 1;
        overflow: hidden;
        color: rgba(255, 255, 255, 0.9);
        font-size: 14px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .topbar-button,
      .icon-button {
        display: inline-grid;
        place-items: center;
        border: 0;
      }

      .topbar-button {
        min-height: 36px;
        padding: 0 12px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.13);
        color: #fff;
        font-size: 13px;
      }

      .topbar-button:active {
        background: rgba(255, 255, 255, 0.22);
      }

      .menu-button {
        display: none;
        width: 38px;
        min-width: 38px;
        padding: 0;
        font-size: 22px;
      }

      .app-content {
        min-width: 0;
        min-height: 0;
        display: grid;
        grid-template-columns: var(--rail-width) var(--panel-width) minmax(0, 1fr);
        overflow: hidden;
      }

      .category-rail {
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 10px 6px;
        overflow-y: auto;
        background: var(--nav);
        scrollbar-width: none;
      }

      .category-rail::-webkit-scrollbar,
      .project-list::-webkit-scrollbar {
        width: 0;
        height: 0;
      }

      .category-button {
        min-height: 63px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 5px;
        flex: 0 0 auto;
        padding: 6px 4px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--nav-muted);
      }

      .category-button .category-mark {
        width: 28px;
        height: 28px;
        display: grid;
        place-items: center;
        border: 1px solid currentColor;
        border-radius: 50%;
        font-size: 14px;
        font-weight: 700;
      }

      .category-button .category-name {
        font-size: 11px;
        line-height: 1.2;
        white-space: nowrap;
      }

      .category-button.active {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
      }

      .category-button.active .category-mark {
        border-color: #d6ad75;
        background: #d6ad75;
        color: #2b2117;
      }

      .project-panel {
        min-width: 0;
        min-height: 0;
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr);
        border-right: 1px solid var(--line);
        background: var(--surface);
        z-index: 30;
      }

      .project-heading {
        padding: 18px 16px 10px;
      }

      .project-heading-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
      }

      .project-heading h2 {
        margin: 0;
        font-size: 18px;
      }

      .project-count {
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }

      .search-wrap {
        padding: 0 12px 12px;
      }

      .project-search {
        width: 100%;
        height: 40px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 6px;
        outline: none;
        background: var(--surface-soft);
        color: var(--text);
        font-size: 14px;
      }

      .project-search:focus {
        border-color: #b6bec6;
        background: #fff;
      }

      .project-list {
        min-height: 0;
        padding: 2px 8px 20px;
        overflow-y: auto;
        scrollbar-width: none;
      }

      .project-button {
        width: 100%;
        min-height: 54px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 10px;
        padding: 9px 10px 9px 12px;
        border: 0;
        border-left: 3px solid transparent;
        border-radius: 4px;
        background: transparent;
        color: var(--text);
        text-align: left;
      }

      .project-button + .project-button {
        margin-top: 2px;
      }

      .project-button strong {
        min-width: 0;
        font-size: 14px;
        font-weight: 600;
        line-height: 1.35;
      }

      .project-button span {
        color: var(--muted);
        font-size: 11px;
        white-space: nowrap;
      }

      .project-button.active {
        border-left-color: var(--app-bar);
        background: var(--active-soft);
        color: #7d1824;
      }

      .project-empty {
        padding: 28px 12px;
        color: var(--muted);
        font-size: 13px;
        text-align: center;
      }

      .viewer {
        min-width: 0;
        min-height: 0;
        display: grid;
        grid-template-rows: 52px minmax(0, 1fr) 58px;
        overflow: hidden;
        background: var(--canvas);
      }

      .viewer-toolbar {
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 14px;
        border-bottom: 1px solid #d8dee3;
        background: #f8fafb;
      }

      .viewer-title {
        min-width: 0;
        flex: 1;
      }

      .viewer-title strong,
      .viewer-title span {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .viewer-title strong {
        font-size: 15px;
      }

      .viewer-title span {
        margin-top: 2px;
        color: var(--muted);
        font-size: 11px;
      }

      .zoom-controls {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .icon-button {
        width: 36px;
        height: 36px;
        border: 1px solid #cfd6dc;
        border-radius: 6px;
        background: #fff;
        color: #2c333a;
        font-size: 20px;
        line-height: 1;
      }

      .icon-button:disabled {
        cursor: default;
        opacity: 0.35;
      }

      .fit-button {
        width: auto;
        min-width: 50px;
        padding: 0 10px;
        font-size: 12px;
      }

      .zoom-value {
        min-width: 42px;
        color: var(--muted);
        font-size: 12px;
        text-align: center;
      }

      .image-stage {
        min-width: 0;
        min-height: 0;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 10px;
        overflow: auto;
        overscroll-behavior: contain;
        touch-action: pan-x pan-y pinch-zoom;
      }

      .page-image {
        display: block;
        width: auto;
        height: 100%;
        max-width: 100%;
        max-height: 100%;
        flex: 0 0 auto;
        object-fit: contain;
        border-radius: 2px;
        background: #fff;
        box-shadow: 0 3px 18px rgba(35, 42, 48, 0.18);
        -webkit-user-drag: none;
        user-select: none;
      }

      .page-image.zoomed {
        max-width: none;
        max-height: none;
      }

      .loading-state {
        align-self: center;
        color: var(--muted);
        font-size: 14px;
      }

      .viewer-footer {
        display: grid;
        grid-template-columns: 112px minmax(0, 1fr) 112px;
        align-items: center;
        gap: 10px;
        padding: 8px 14px;
        border-top: 1px solid #d8dee3;
        background: #f8fafb;
      }

      .page-nav-button {
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: 1px solid #cbd3d9;
        border-radius: 6px;
        background: #fff;
        color: #26313a;
        font-weight: 600;
      }

      .page-nav-button:disabled {
        cursor: default;
        color: #9ba4ac;
        background: #eef1f3;
      }

      .page-nav-button .arrow {
        font-size: 22px;
        line-height: 1;
      }

      .page-status {
        min-width: 0;
        text-align: center;
      }

      .page-status strong,
      .page-status span {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .page-status strong {
        font-size: 14px;
      }

      .page-status span {
        margin-top: 2px;
        color: var(--muted);
        font-size: 11px;
      }

      .drawer-scrim {
        display: none;
      }

      @media (max-width: 1050px) {
        :root {
          --rail-width: 82px;
          --panel-width: 236px;
        }

        .category-button {
          min-height: 59px;
        }

        .project-heading {
          padding-left: 14px;
          padding-right: 14px;
        }

        .topbar-brand {
          min-width: 204px;
        }
      }

      @media (max-width: 900px) {
        :root {
          --topbar-height: 56px;
        }

        .topbar {
          gap: 8px;
          padding-left: 8px;
          padding-right: 8px;
        }

        .menu-button {
          display: inline-grid;
        }

        .topbar-brand {
          min-width: 0;
          flex: 1;
        }

        .topbar-title span,
        .breadcrumb,
        .install-button,
        .lock-button {
          display: none;
        }

        .app-content {
          display: block;
        }

        .category-rail {
          position: fixed;
          right: 0;
          bottom: 0;
          left: 0;
          z-index: 44;
          height: calc(62px + env(safe-area-inset-bottom));
          display: flex;
          flex-direction: row;
          gap: 2px;
          padding: 4px 6px env(safe-area-inset-bottom);
          overflow-x: auto;
          overflow-y: hidden;
          border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .category-button {
          min-width: 70px;
          min-height: 54px;
          gap: 3px;
        }

        .category-button .category-mark {
          width: 25px;
          height: 25px;
          font-size: 12px;
        }

        .project-panel {
          position: fixed;
          top: var(--topbar-height);
          bottom: calc(62px + env(safe-area-inset-bottom));
          left: 0;
          width: min(86vw, 330px);
          transform: translateX(-102%);
          box-shadow: 10px 0 28px rgba(21, 28, 34, 0.2);
          transition: transform 180ms ease;
        }

        .project-panel.open {
          transform: translateX(0);
        }

        .drawer-scrim {
          position: fixed;
          inset: var(--topbar-height) 0 calc(62px + env(safe-area-inset-bottom));
          z-index: 25;
          display: block;
          border: 0;
          background: rgba(20, 27, 33, 0.42);
        }

        .viewer {
          height: calc(100dvh - var(--topbar-height) - 62px - env(safe-area-inset-bottom));
          grid-template-rows: 46px minmax(0, 1fr) 52px;
        }

        .viewer-toolbar {
          padding: 0 8px;
        }

        .zoom-controls {
          gap: 2px;
        }

        .icon-button {
          width: 32px;
          height: 32px;
        }

        .fit-button,
        .zoom-value {
          display: none;
        }

        .image-stage {
          padding: 5px;
        }

        .viewer-footer {
          grid-template-columns: 78px minmax(0, 1fr) 78px;
          padding: 6px 8px;
        }

        .page-nav-button {
          height: 38px;
          font-size: 12px;
        }

        .page-nav-button .arrow {
          font-size: 19px;
        }
      }

      @media (max-height: 690px) and (min-width: 761px) {
        .category-button {
          min-height: 52px;
        }

        .category-button .category-mark {
          width: 24px;
          height: 24px;
          font-size: 12px;
        }

        .viewer {
          grid-template-rows: 46px minmax(0, 1fr) 52px;
        }
      }
    </style>
  </head>
  <body>
    <section id="accessScreen" class="access-screen hidden" aria-labelledby="accessTitle">
      <div class="access-card">
        <div class="access-brand">
          <div class="brand-mark" aria-hidden="true">馨</div>
          <div>
            <strong>馨园时珍</strong>
            <span>门店价目册</span>
          </div>
        </div>
        <h1 id="accessTitle" class="access-title">请输入访问密码</h1>
        <p class="access-text">此价目册仅供受邀人员查看。</p>
        <form id="accessForm" class="access-form">
          <input
            id="passwordInput"
            class="password-input"
            type="password"
            placeholder="访问密码"
            autocomplete="current-password"
            aria-label="访问密码"
          />
          <button class="primary-button" type="submit">进入</button>
        </form>
        <div id="accessError" class="access-error" role="alert"></div>
      </div>
    </section>

    <div id="appShell" class="app-shell hidden">
      <header class="topbar">
        <button id="menuButton" class="topbar-button menu-button" type="button" aria-label="打开项目目录" title="项目目录">☰</button>
        <div class="topbar-brand">
          <div class="brand-mark" aria-hidden="true">馨</div>
          <div class="topbar-title">
            <strong>门店价目册</strong>
            <span>馨园时珍</span>
          </div>
        </div>
        <div id="breadcrumb" class="breadcrumb"></div>
        <div class="topbar-actions">
          <button id="installButton" class="topbar-button install-button hidden" type="button">安装到桌面</button>
          <button id="lockButton" class="topbar-button lock-button" type="button">锁定</button>
        </div>
      </header>

      <div class="app-content">
        <nav id="categoryRail" class="category-rail" aria-label="价目册大类"></nav>

        <aside id="projectPanel" class="project-panel" aria-label="项目目录">
          <div class="project-heading">
            <div class="project-heading-row">
              <h2 id="categoryTitle">项目目录</h2>
              <span id="projectCount" class="project-count"></span>
            </div>
          </div>
          <div class="search-wrap">
            <input id="projectSearch" class="project-search" type="search" placeholder="搜索项目" aria-label="搜索项目" />
          </div>
          <div id="projectList" class="project-list"></div>
        </aside>

        <button id="drawerScrim" class="drawer-scrim hidden" type="button" aria-label="关闭项目目录"></button>

        <main class="viewer">
          <div class="viewer-toolbar">
            <div class="viewer-title">
              <strong id="viewerProjectTitle"></strong>
              <span id="viewerCategoryTitle"></span>
            </div>
            <div class="zoom-controls" aria-label="页面缩放">
              <button id="zoomOutButton" class="icon-button" type="button" aria-label="缩小" title="缩小">−</button>
              <span id="zoomValue" class="zoom-value">适屏</span>
              <button id="zoomInButton" class="icon-button" type="button" aria-label="放大" title="放大">+</button>
              <button id="fitButton" class="icon-button fit-button" type="button" aria-label="恢复适屏" title="恢复适屏">适屏</button>
            </div>
          </div>

          <div id="imageStage" class="image-stage">
            <div id="loadingState" class="loading-state">正在打开页面…</div>
            <img id="pageImage" class="page-image hidden" alt="" draggable="false" />
          </div>

          <footer class="viewer-footer">
            <button id="previousButton" class="page-nav-button" type="button">
              <span class="arrow" aria-hidden="true">‹</span>
              <span>上一页</span>
            </button>
            <div class="page-status">
              <strong id="pagePosition"></strong>
              <span id="globalPage"></span>
            </div>
            <button id="nextButton" class="page-nav-button" type="button">
              <span>下一页</span>
              <span class="arrow" aria-hidden="true">›</span>
            </button>
          </footer>
        </main>
      </div>
    </div>

    <script>
      const ACCESS_TOKEN = "Ag6EG4P0-qSQMZeFNPOFfAQe";
      const ACCESS_PASSWORD = "xy881688";
      const ACCESS_STORAGE_KEY = "price-book-site-auth";
      const TOTAL_PAGES = 108;

      const catalogue = [
        {
          id: "brand",
          name: "品牌介绍",
          mark: "品",
          items: [
            { name: "封面与目录", pages: [1, 2, 3] },
            { name: "品牌创始人", pages: [4, 5] },
            { name: "品牌发展", pages: [6, 7] },
            { name: "企业文化", pages: [8, 9] },
            { name: "学科带头人", pages: [10, 11] },
            { name: "服务特色", pages: [12, 13] }
          ]
        },
        {
          id: "prices",
          name: "品项价格",
          mark: "价",
          items: [
            { name: "新客与痛症价格", pages: [14] },
            { name: "甲乳专科价格", pages: [15] },
            { name: "体质调理价格", pages: [16] },
            { name: "中医美容价格", pages: [17] },

        {

          items: [

            { name: "聚宝臀·特调版", pages: [84, 85] },
            { name: "美臀活源与修护", pages: [86, 87] },
            { name: "美臀焕肤与活力", pages: [88, 89] },
            { name: "美臀焕源与塑美", pages: [90, 91] }
          ]
        },
        {
          id: "products",
          name: "产品系列",
          mark: "产",
          items: [
            { name: "产品系列与专利", pages: [92, 93] },
            { name: "通元药液", pages: [94] },
            { name: "固元药液", pages: [95] },
            { name: "疏元药液", pages: [96] },
            { name: "开元药液", pages: [97] },
            { name: "调元药液", pages: [98] },
            { name: "绮思香药液", pages: [99] },
            { name: "集美堂天然植萃", pages: [100, 101] },
            { name: "女性产品与胶原蛋白", pages: [102, 103] },
            { name: "瑞妍科丽系列", pages: [104, 105] },
            { name: "瑞妍科丽功效与精华", pages: [106, 107] },
            { name: "封底", pages: [108] }
          ]
        }
      ];

      const state = {
        categoryIndex: 0,
        itemIndex: 0,
        itemPageIndex: 0,
        zoom: 1,
        initialized: false,
        installPrompt: null,
        touchStartX: null,
        touchStartY: null
      };

      const elements = {};

      function hasValidLink() {
        return new URLSearchParams(window.location.search).get("k") === ACCESS_TOKEN;
      }

      function hasValidPassword() {
        return window.sessionStorage.getItem(ACCESS_STORAGE_KEY) === "ok";
      }

      function pageSource(page) {
        return `./pages/page-${String(page).padStart(3, "0")}.jpg`;
      }

      function pageLabel(pages) {
        if (pages.length === 1) return `第 ${pages[0]} 页`;
        return `第 ${pages[0]}–${pages[pages.length - 1]} 页`;
      }

      function getCurrentCategory() {
        return catalogue[state.categoryIndex];
      }

      function getCurrentItem() {
        return getCurrentCategory().items[state.itemIndex];
      }

      function getCurrentPage() {
        return getCurrentItem().pages[state.itemPageIndex];
      }

      function findPage(page) {
        for (let categoryIndex = 0; categoryIndex < catalogue.length; categoryIndex += 1) {
          const category = catalogue[categoryIndex];
          for (let itemIndex = 0; itemIndex < category.items.length; itemIndex += 1) {
            const itemPageIndex = category.items[itemIndex].pages.indexOf(page);
            if (itemPageIndex !== -1) return { categoryIndex, itemIndex, itemPageIndex };
          }
        }
        return null;
      }

      function getPageFromHash() {
        const match = window.location.hash.match(/page-(\d{1,3})/);
        if (!match) return null;
        const page = Number(match[1]);
        return page >= 1 && page <= TOTAL_PAGES ? page : null;
      }

      function setHash(page) {
        const nextHash = `#page-${String(page).padStart(3, "0")}`;
        if (window.location.hash !== nextHash) history.replaceState(null, "", nextHash);
      }

      function cacheElements() {
        [
          "accessScreen",
          "accessForm",
          "passwordInput",
          "accessError",
          "appShell",
          "menuButton",
          "breadcrumb",
          "installButton",
          "lockButton",
          "categoryRail",
          "projectPanel",
          "drawerScrim",
          "categoryTitle",
          "projectCount",
          "projectSearch",
          "projectList",
          "viewerProjectTitle",
          "viewerCategoryTitle",
          "zoomOutButton",
          "zoomInButton",
          "fitButton",
          "zoomValue",
          "imageStage",
          "pageImage",
          "loadingState",
          "previousButton",
          "nextButton",
          "pagePosition",
          "globalPage"
        ].forEach((id) => {
          elements[id] = document.getElementById(id);
        });
      }

      function renderCategories() {
        elements.categoryRail.replaceChildren();
        catalogue.forEach((category, index) => {
          const button = document.createElement("button");
          button.className = "category-button";
          button.type = "button";
          button.dataset.index = String(index);
          button.setAttribute("aria-label", category.name);
          button.innerHTML = `<span class="category-mark">${category.mark}</span><span class="category-name">${category.name}</span>`;
          button.addEventListener("click", () => selectCategory(index));
          elements.categoryRail.appendChild(button);
        });
      }

      function renderProjects() {
        const category = getCurrentCategory();
        const query = elements.projectSearch.value.trim().toLowerCase();
        elements.categoryTitle.textContent = category.name;
        elements.projectCount.textContent = `${category.items.length} 个项目`;
        elements.projectList.replaceChildren();

        let visibleCount = 0;
        category.items.forEach((item, index) => {
          if (query && !item.name.toLowerCase().includes(query)) return;
          visibleCount += 1;
          const button = document.createElement("button");
          button.className = "project-button";
          button.type = "button";
          button.dataset.index = String(index);
          const name = document.createElement("strong");
          name.textContent = item.name;
          const pages = document.createElement("span");
          pages.textContent = pageLabel(item.pages);
          button.append(name, pages);
          button.addEventListener("click", () => selectItem(index));
          elements.projectList.appendChild(button);
        });

        if (!visibleCount) {
          const empty = document.createElement("div");
          empty.className = "project-empty";
          empty.textContent = "没有找到相关项目";
          elements.projectList.appendChild(empty);
        }

        updateActiveStates();
      }

      function updateActiveStates() {
        document.querySelectorAll(".category-button").forEach((button) => {
          button.classList.toggle("active", Number(button.dataset.index) === state.categoryIndex);
        });
        document.querySelectorAll(".project-button").forEach((button) => {
          button.classList.toggle("active", Number(button.dataset.index) === state.itemIndex);
        });
      }

      function selectCategory(index) {
        state.categoryIndex = index;
        state.itemIndex = 0;
        state.itemPageIndex = 0;
        elements.projectSearch.value = "";
        renderProjects();
        renderPage();
      }

      function selectItem(index) {
        state.itemIndex = index;
        state.itemPageIndex = 0;
        updateActiveStates();
        renderPage();
        closeDrawer();
      }

      function selectPage(page) {
        const location = findPage(page);
        if (!location) return;
        state.categoryIndex = location.categoryIndex;
        state.itemIndex = location.itemIndex;
        state.itemPageIndex = location.itemPageIndex;
        elements.projectSearch.value = "";
        renderProjects();
        renderPage();
      }

      function renderPage() {
        const category = getCurrentCategory();
        const item = getCurrentItem();
        const page = getCurrentPage();

        resetZoom();
        elements.breadcrumb.textContent = `${category.name} / ${item.name}`;
        elements.viewerProjectTitle.textContent = item.name;
        elements.viewerCategoryTitle.textContent = category.name;
        elements.pagePosition.textContent = item.pages.length === 1
          ? "本项目共 1 页"
          : `本项目第 ${state.itemPageIndex + 1} / ${item.pages.length} 页`;
        elements.globalPage.textContent = `价目册第 ${page} / ${TOTAL_PAGES} 页`;
        elements.previousButton.disabled = page <= 1;
        elements.nextButton.disabled = page >= TOTAL_PAGES;
        elements.pageImage.classList.add("hidden");
        elements.loadingState.classList.remove("hidden");
        elements.loadingState.textContent = "正在打开页面…";
        elements.pageImage.alt = `${category.name}，${item.name}，第 ${page} 页`;
        elements.pageImage.src = pageSource(page);
        setHash(page);
        preloadPage(page - 1);
        preloadPage(page + 1);
      }

      function preloadPage(page) {
        if (page < 1 || page > TOTAL_PAGES) return;
        const image = new Image();
        image.src = pageSource(page);
      }

      function movePage(direction) {
        const nextPage = getCurrentPage() + direction;
        if (nextPage < 1 || nextPage > TOTAL_PAGES) return;
        selectPage(nextPage);
      }

      function setZoom(nextZoom) {
        state.zoom = Math.min(2.5, Math.max(1, Number(nextZoom.toFixed(2))));
        const isZoomed = state.zoom > 1;
        elements.pageImage.classList.toggle("zoomed", isZoomed);
        elements.pageImage.style.height = isZoomed ? `${state.zoom * 100}%` : "100%";
        elements.zoomValue.textContent = isZoomed ? `${Math.round(state.zoom * 100)}%` : "适屏";
        elements.zoomOutButton.disabled = state.zoom <= 1;
        elements.zoomInButton.disabled = state.zoom >= 2.5;
        if (!isZoomed) elements.imageStage.scrollTo({ top: 0, left: 0 });
      }

      function resetZoom(updateControls = true) {
        state.zoom = 1;
        elements.pageImage.classList.remove("zoomed");
        elements.pageImage.style.height = "100%";
        elements.imageStage.scrollTo({ top: 0, left: 0 });
        if (updateControls) {
          elements.zoomValue.textContent = "适屏";
          elements.zoomOutButton.disabled = true;
          elements.zoomInButton.disabled = false;
        }
      }

      function openDrawer() {
        elements.projectPanel.classList.add("open");
        elements.drawerScrim.classList.remove("hidden");
      }

      function closeDrawer() {
        elements.projectPanel.classList.remove("open");
        elements.drawerScrim.classList.add("hidden");
      }

      function bindEvents() {
        elements.projectSearch.addEventListener("input", renderProjects);
        elements.menuButton.addEventListener("click", openDrawer);
        elements.drawerScrim.addEventListener("click", closeDrawer);
        elements.previousButton.addEventListener("click", () => movePage(-1));
        elements.nextButton.addEventListener("click", () => movePage(1));
        elements.zoomOutButton.addEventListener("click", () => setZoom(state.zoom - 0.25));
        elements.zoomInButton.addEventListener("click", () => setZoom(state.zoom + 0.25));
        elements.fitButton.addEventListener("click", () => resetZoom());
        elements.lockButton.addEventListener("click", () => {
          window.sessionStorage.removeItem(ACCESS_STORAGE_KEY);
          window.location.reload();
        });
        elements.installButton.addEventListener("click", async () => {
          if (!state.installPrompt) return;
          state.installPrompt.prompt();
          await state.installPrompt.userChoice;
          state.installPrompt = null;
          elements.installButton.classList.add("hidden");
        });
        elements.pageImage.addEventListener("load", () => {
          elements.loadingState.classList.add("hidden");
          elements.pageImage.classList.remove("hidden");
        });
        elements.pageImage.addEventListener("error", () => {
          elements.pageImage.classList.add("hidden");
          elements.loadingState.classList.remove("hidden");
          elements.loadingState.textContent = "页面加载失败，请检查网络后重试";
        });
        elements.pageImage.addEventListener("contextmenu", (event) => event.preventDefault());
        elements.imageStage.addEventListener("touchstart", (event) => {
          if (event.touches.length !== 1 || state.zoom > 1) return;
          state.touchStartX = event.touches[0].clientX;
          state.touchStartY = event.touches[0].clientY;
        }, { passive: true });
        elements.imageStage.addEventListener("touchend", (event) => {
          if (state.touchStartX === null || !event.changedTouches.length || state.zoom > 1) return;
          const deltaX = event.changedTouches[0].clientX - state.touchStartX;
          const deltaY = event.changedTouches[0].clientY - state.touchStartY;
          state.touchStartX = null;
          state.touchStartY = null;
          if (Math.abs(deltaX) > 65 && Math.abs(deltaX) > Math.abs(deltaY) * 1.3) {
            movePage(deltaX < 0 ? 1 : -1);
          }
        }, { passive: true });
        document.addEventListener("keydown", (event) => {
          if (event.target === elements.projectSearch) return;
          if (event.key === "ArrowLeft") movePage(-1);
          if (event.key === "ArrowRight") movePage(1);
          if (event.key === "Escape") closeDrawer();
        });
        window.addEventListener("hashchange", () => {
          const page = getPageFromHash();
          if (page && page !== getCurrentPage()) selectPage(page);
        });
        window.addEventListener("beforeinstallprompt", (event) => {
          event.preventDefault();
          state.installPrompt = event;
          elements.installButton.classList.remove("hidden");
        });
      }

      function initApp() {
        if (state.initialized) return;
        state.initialized = true;
        renderCategories();
        bindEvents();
        const requestedPage = getPageFromHash();
        if (requestedPage) {
          const location = findPage(requestedPage);
          if (location) Object.assign(state, location);
        }
        renderProjects();
        renderPage();
        setZoom(1);
      }

      function revealApp() {
        elements.accessScreen.classList.add("hidden");
        elements.appShell.classList.remove("hidden");
        initApp();
      }

      function boot() {
        cacheElements();
        if (!hasValidLink()) {
          elements.accessScreen.classList.remove("hidden");
          elements.accessForm.classList.add("hidden");
          elements.accessError.textContent = "链接无效，请让发送人重新发送完整链接。";
          return;
        }

        if (hasValidPassword()) {
          revealApp();
          return;
        }

        elements.accessScreen.classList.remove("hidden");
        window.setTimeout(() => elements.passwordInput.focus(), 50);
        elements.accessForm.addEventListener("submit", (event) => {
          event.preventDefault();
          if (elements.passwordInput.value === ACCESS_PASSWORD) {
            window.sessionStorage.setItem(ACCESS_STORAGE_KEY, "ok");
            elements.accessError.textContent = "";
            revealApp();
          } else {
            elements.accessError.textContent = "密码不正确，请重新输入。";
            elements.passwordInput.select();
          }
        });
      }

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => navigator.serviceWorker.register("./service-worker.js"));
      }

      boot();
    </script>
